name: Code quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: ruff check src tests

      - name: Run Bandit
        run: bandit -r src/gun101tpm -x src/gun101tpm/build -ll

  dynamic-analysis:
    name: Dynamic analysis
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests with assertions enabled
        env:
          PYTHONOPTIMIZE: ""
        run: python -m pytest tests/ -q --cov=src/gun101tpm --cov-branch --cov-report=term-missing --cov-fail-under=90

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install build tool
        run: python -m pip install --upgrade pip build

      - name: Build wheel and source distribution
        env:
          SOURCE_DATE_EPOCH: "1720000000"
        run: python scripts/build_reproducible.py

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --strict

      - name: Audit dependency licenses
        run: |
          pip-licenses --format=plain | tee licenses.txt
          if grep -Eq 'GPL|AGPL|SSPL' licenses.txt; then
            echo "A disallowed copyleft dependency license was detected."
            exit 1
          fi