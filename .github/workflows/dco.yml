name: DCO check

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: Require signed-off commits
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          for commit in $(git rev-list "$BASE_SHA..$HEAD_SHA"); do
            if ! git log -1 --format=%B "$commit" | grep -Eq '^Signed-off-by: .+ <.+>$'; then
              echo "Commit $commit is missing a Signed-off-by trailer."
              exit 1
            fi
          done