[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gun101-tpm"
version = "1.0.0"
description = "GUN-101-TPM: Hardware-bound file encryption using TPM 2.0"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Aditya Raj"}
]
keywords = ["encryption", "TPM", "hardware-bound", "security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: POSIX :: Linux",
    "Topic :: Security :: Cryptography"
]
dependencies = [
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.2"
]

[project.optional-dependencies]
tpm = ["tpm2-pytss>=2.3.0; sys_platform == 'linux'"]
dev = [
    "bandit>=1.7.9",
    "pip-audit>=2.7.3",
    "pip-licenses>=4.3.4",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
gun101tpm = "gun101tpm.cli:main"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["src/gun101tpm"]
omit = [
    "src/gun101tpm/main.py",
    "src/gun101tpm/backends/linux.py",
    "src/gun101tpm/backends/windows.py",
]

[tool.coverage.report]
fail_under = 90